name: Web and MCP

# The iOS app has had a clean-clone build guard since HQ-608. The admin tool and the MCP
# server had nothing: no test run, no build, and no check that their dependencies are safe.
#
# The dependency half exists because of a real event. On 2026-08-19, adding web/package-lock.json
# surfaced six Dependabot alerts (three high) within the hour, all transitive through `next` and
# `firebase-admin`. They were fixed by hand the same day. This job is what makes the next six
# fail a check instead of arriving as an email somebody has to act on.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # Vulnerabilities are published against code that has not changed, so a push-only trigger
  # would go quiet on a branch nobody is touching. Weekly catches those.
  schedule:
    - cron: '0 13 * * 1'

concurrency:
  group: web-and-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [web, mcp]

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      # firebase-tools needs Java 21 or newer for the Firestore emulator, and the runner's
      # default is older. Pinned rather than "latest" so a JDK release cannot break CI on a
      # morning nobody touched the code.
      - uses: actions/setup-java@v6
        if: matrix.package == 'web'
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      # `npm ci` on purpose: it installs exactly the lockfile. `npm install` would silently
      # resolve something newer, and then this job would be testing a tree that does not
      # match what anyone else gets.
      - name: Install
        run: npm ci

      # Say what was examined. A security job that finds nothing and a security job that
      # looked at nothing print the same thing otherwise, and the second one is worse than
      # having no job at all.
      - name: Audit dependencies
        run: |
          count=$(npm ls --all --parseable 2>/dev/null | wc -l | tr -d ' ')
          echo "CHECKED $count installed packages in ${{ matrix.package }}/"
          if [ "$count" -lt 2 ]; then
            echo "::error::Resolved $count packages. That is a broken install, not a clean audit."
            exit 1
          fi
          npm audit --audit-level=moderate

      # Source-level, and it runs BEFORE the build because it needs no server and it catches
      # the one class the asset check structurally cannot: a fetch happens from JavaScript in
      # response to a user action, so nothing in the served HTML reveals it. That is how
      # `fetch('/api/admin/session')` reached production and 404'd immediately after a
      # successful Google sign-in, looking exactly like a broken login.
      - name: Check hand-written URLs carry the base path
        if: matrix.package == 'web'
        run: npm run check:basepath

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # The emulator suite. It existed and had NEVER RUN: `npm test` skips it unless
      # FIRESTORE_EMULATOR_HOST is set, and nothing set it, so a green `npm test` covered four
      # tests that had not executed since the day they were written.
      #
      # It is a separate step from `Test` because it needs Java and a downloaded emulator, and
      # because a failure here should read as "the write path is wrong" rather than as a unit
      # test failing.
      - name: Test against the Firestore emulator
        if: matrix.package == 'web'
        run: bash ../scripts/test-emulator.sh

      - name: Build
        run: npm run build

      # Start the built app and ask it for every URL its own pages reference.
      #
      # This catches a class nothing above it can. The app carries a Next `basePath`, and Next
      # prefixes what it controls but not a raw <img src>, a plain <a href>, or metadata.icons.
      # On 2026-08-19 the masthead icon 404'd in production while working in development,
      # where the prefix is already in the URL you typed. tsc passed, the build passed, 57
      # unit tests passed, and the page was broken.
      #
      # web only: the MCP server has no pages.
      - name: Check every referenced URL resolves
        if: matrix.package == 'web'
        run: |
          npm start > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/knight-life/admin && break
            sleep 1
          done
          node scripts/check-assets.mjs \
            http://localhost:3000/knight-life \
            http://localhost:3000/knight-life/admin
