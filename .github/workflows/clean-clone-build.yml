name: Clean clone build

# HQ-608.
#
# From 2024-08-15 to 2026-08-19 this repo could not be built from a clean clone.
# Four unanchored .gitignore patterns (*.cc, *.h, *.inc, *.m) stripped every
# header out of the committed Pods/ tree. It stayed invisible for two years
# because everyone who touched the repo already had Pods/ on disk.
#
# This workflow is the mechanism that makes that impossible to repeat: every push
# checks out a fresh tree that has never seen a developer's machine, runs
# `pod install`, and builds. If a dependency is missing from the checkout, or an
# ignore rule swallows something the build needs, this job goes red.

# This job takes a macOS runner, which is the scarcest thing in CI, so it runs only when it
# could possibly say something.
#
# On 2026-08-19 seventeen of these were queued at once and none were running. Two causes,
# both self-inflicted:
#
#   - `push` on every branch PLUS `pull_request` fired TWO runs per push, and the concurrency
#     group keyed on `github.ref` did not dedupe them, because a push and a pull_request have
#     different refs for the same commit.
#   - Dependabot's JavaScript pull requests (next, vitest) triggered a full iOS build. Nothing
#     under BBNDaily/ changed in either, so both were guaranteed to build exactly the tree
#     that already passed.
#
# Now: pull_request covers branches, push covers main, neither fires for a change that cannot
# affect an iOS build, and the concurrency group is keyed so a push and its PR share one slot.
on:
  push:
    branches: [main]
    paths-ignore: &non-ios
      - 'web/**'
      - 'mcp/**'
      - 'docs/**'
      - '**.md'
      - '.github/workflows/web-and-mcp.yml'
      - '.github/dependabot.yml'
  pull_request:
    paths-ignore: *non-ios
  workflow_dispatch:

concurrency:
  # PR number when there is one, ref otherwise, so a push and its pull request do not each
  # take a macOS runner to build the same commit.
  group: clean-clone-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitignore-scope:
    name: .gitignore scope guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No unanchored source patterns, no half-tracked Pods
        run: ./scripts/check-gitignore-scope.sh

  resolver-inputs:
    name: Resolver inputs have writers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cheap, and it catches a class no test can: a feature that is compiled, silent, and
      # always falls back because the code that loads its data was lost in a merge.
      - name: Every input resolveDay reads is written somewhere
        run: ./scripts/check-resolver-inputs.sh

  app-urls:
    name: App URLs use the canonical host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One missing `www.` costs a cross-host 308, which drops the Authorization header and
      # reports itself to the student as "Sign in with Google first." Invisible in review.
      - name: No bare-apex mikeveson.com in Swift
        run: ./scripts/check-app-urls.sh

  settings-sections:
    name: Settings sections are named, not numbered
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A stale section index repaints the wrong rows, which reads as a delete that did not work.
      - name: No bare integer section indices in Settings
        run: ./scripts/check-settings-sections.sh

  clean-clone-build:
    name: Build from a fresh clone
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      # A fresh checkout on a fresh runner. Nothing here has ever had Pods/ on
      # disk, which is precisely the condition that hid HQ-608.
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          pod --version

      # If the checkout already contains Pods/, someone has re-vendored a
      # partial dependency tree and we are back in the HQ-608 failure mode.
      - name: Assert Pods/ is not in the checkout
        run: |
          if [ -e Pods ]; then
            echo "::error::Pods/ is present in a fresh checkout. This repo does not vendor Pods/; Podfile.lock plus 'pod install' is the contract. See scripts/check-gitignore-scope.sh."
            exit 1
          fi
          echo "OK: Pods/ absent, as expected."

      # No cache of Pods/ on purpose. A warm Pods/ sandbox is what makes this
      # bug invisible: `pod install` sees a matching Manifest.lock and skips the
      # download, so a gutted tree looks installed. Only ~/Library/Caches is
      # cached, which holds downloaded archives and cannot mask a missing file.
      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: cocoapods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: cocoapods-${{ runner.os }}-

      - name: pod install
        run: pod install --repo-update

      # `pod install` must not drift from the committed lockfile. If it does, the
      # lockfile is not actually pinning the build.
      #
      # The trailing `COCOAPODS:` line records which CocoaPods binary last wrote
      # the file, not a dependency version, and it legitimately differs between
      # a developer's machine and the runner. Every other line -- the resolved
      # versions, the dependency graph, and the SPEC CHECKSUMS -- must match.
      - name: Assert Podfile.lock did not drift
        run: |
          drift=$(git diff -U0 -- Podfile.lock \
                  | grep -E '^[+-][^+-]' \
                  | grep -v '^[+-]COCOAPODS:' || true)
          if [ -n "$drift" ]; then
            echo "::error::pod install resolved different dependencies than Podfile.lock pins. Commit the updated lockfile deliberately."
            printf '%s\n' "$drift"
            exit 1
          fi
          echo "OK: resolved versions and checksums match Podfile.lock."

      # The direct HQ-608 assertion: headers exist. If the ignore rules ever
      # strip dependency source again, this fires before the build does, with a
      # message that names the cause.
      - name: Assert dependency headers are present
        run: |
          count=$(find Pods -name '*.h' | wc -l | tr -d ' ')
          echo "Pods/ header count: $count"
          if [ "$count" -lt 1000 ]; then
            echo "::error::Only $count header(s) under Pods/. Expected several thousand. Dependency source is missing (this is the HQ-608 failure)."
            exit 1
          fi

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -workspace BBNDaily.xcworkspace \
            -scheme BBNDaily \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build \
            CODE_SIGNING_ALLOWED=NO \
            | tee /tmp/xcodebuild.log \
            | grep -E '^(\*\*|CompileSwift|Ld|error:|warning: .*deprecat)' || true
          grep -q '^\*\* BUILD SUCCEEDED \*\*' /tmp/xcodebuild.log

      # Tests, in the same job, because they need the same Pods/ tree and the same
      # toolchain. They were added with HQ-640: resolveDay decides what every student sees
      # and what every notification fires for, and until then it had no tests at all.
      #
      # The simulator is DISCOVERED, never named. The first version of this step hardcoded
      # `name=iPhone 16` and failed immediately: the runner image offered 16e, 17, 17 Pro,
      # 17 Pro Max, 17e and Air, and no plain 16. Device names turn over whenever GitHub
      # updates the image, so any name written here has an expiry date that nobody notices
      # until a build goes red for a reason unrelated to the change that triggered it.
      #
      # A generic destination is not an option either: `generic/platform=iOS Simulator`
      # builds but cannot run a test.
      #
      # The WHOLE target, not a named suite. It used to name ResolveDayTests specifically, to
      # avoid running the empty 2021 template alongside it. That template is deleted, so the
      # exclusion is gone too -- and it had to go, because naming one suite meant every suite
      # added afterwards was silently not run. FirestoreParsingTests would have been the first.
      #
      # This is the same failure as the template itself, one level up: a green tick that
      # covers less than it appears to.
      - name: Test
        run: |
          set -o pipefail
          line=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1)
          udid=$(printf '%s' "$line" | grep -oE '[0-9A-Fa-f-]{36}' | head -1)
          if [ -z "$udid" ]; then
            echo "::error::Found no available iPhone simulator. That is a broken discovery step, not a pass."
            xcrun simctl list devices available
            exit 1
          fi
          echo "CHECKED simulator:$(printf '%s' "$line" | sed 's/ (.*//')"
          xcodebuild test \
            -workspace BBNDaily.xcworkspace \
            -scheme BBNDaily \
            -destination "platform=iOS Simulator,id=$udid" \
            -only-testing:BBNDailyTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee /tmp/xctest.log \
            | grep -E '^(Test Case|Executed|\*\*|error:)' || true
          # Say what ran. A test step that executed nothing and a test step that found no
          # failures print the same "** TEST SUCCEEDED **" otherwise.
          executed=$(grep -oE 'Executed [0-9]+ test' /tmp/xctest.log | head -1 | grep -oE '[0-9]+' || echo 0)
          echo "CHECKED $executed tests"
          if [ "$executed" -lt 1 ]; then
            echo "::error::Ran $executed tests. Zero is a broken discovery step, not a pass."
            exit 1
          fi
          grep -q '^\*\* TEST SUCCEEDED \*\*' /tmp/xctest.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xctest-log
          path: /tmp/xctest.log
          if-no-files-found: ignore

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: ignore
